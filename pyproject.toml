[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-projects"
version = "0.2.0"
description = "Local, git-aware tracker for personal projects and the themes they belong to"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
claude-projects = "claude_projects.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["claude_projects"]

[tool.pytest.ini_options]
testpaths = ["tests"]
